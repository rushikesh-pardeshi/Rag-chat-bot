# pyproject.toml
# Role: Tooling configuration only (pytest, ruff, mypy). Dependencies stay pinned in
# requirements.txt; there is deliberately no [project] table so `uv` does not treat this
# repo as an installable package.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "requires_db: test needs a reachable PostgreSQL 17",
    "requires_aws: test would contact AWS — must never be enabled in CI",
    "requires_pinecone: test would contact Pinecone — must never be enabled in CI",
]
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 95
target-version = "py313"
exclude = [".venv", "alembic/versions", "frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "S",    # bandit — security lint, the point of having it here
    "UP",   # pyupgrade
    "ASYNC",
    "C4",
    "SIM",
]
ignore = [
    "S101",  # asserts are fine in tests
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "S311"]  # test fixtures carry dummy secrets
"scripts/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["^alembic/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false
